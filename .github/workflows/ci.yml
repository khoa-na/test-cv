name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MPLCONFIGDIR: /tmp
      YOLO_CONFIG_DIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Static checks
        run: |
          python -m compileall -q benchmarks data_tools demo pipelines ros2 tools training
          python -m ruff check .
      - name: Portfolio integrity
        run: python tools/validate_portfolio.py
      - name: Model smoke inference
        run: python -m demo.model_smoke
      - name: Tests
        run: python -m pytest -q
