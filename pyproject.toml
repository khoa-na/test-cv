[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stereo-pothole-localization"
version = "0.1.0"
description = "CPU-oriented pothole perception and GPS-degraded localization case study"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "Khoa Na" }]
keywords = ["computer-vision", "stereo-vision", "visual-odometry", "localization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "matplotlib>=3.11,<4",
  "numpy>=2.4,<3",
  "onnx>=1.22,<2",
  "onnxruntime>=1.28,<2",
  "opencv-python>=5,<6",
  "PyYAML>=6,<7",
  "torch>=2.13,<3",
  "torchvision>=0.28,<1",
  "ultralytics>=8.4,<9",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.12,<1",
]
report = [
  "Markdown>=3.8,<4",
  "weasyprint>=66,<67",
]

[project.scripts]
portfolio-check = "tools.validate_portfolio:main"
pothole-model-smoke = "demo.model_smoke:main"

[project.urls]
Homepage = "https://github.com/khoa-na/pothole-gps-localization"
Repository = "https://github.com/khoa-na/pothole-gps-localization"

[tool.setuptools.packages.find]
include = ["benchmarks*", "data_tools*", "demo*", "pipelines*", "ros2*", "tools*", "training*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".cache", ".venv", "artifacts", "runs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F63", "F7", "F82"]
