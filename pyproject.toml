# This repository is an application/case study, not a self-contained PyPI
# distribution. Install the pinned requirements and run modules from a clone.
# Keeping tool configuration here avoids advertising a wheel that cannot carry
# the datasets, benchmark evidence, report, and model provenance together.

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".cache", ".venv", "artifacts", "runs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F63", "F7", "F82"]
