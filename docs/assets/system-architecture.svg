<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Shared stereo perception and localization architecture</title>
  <desc id="desc">Stereo camera feeds pothole segmentation, stereo geometry, and visual odometry. Pothole masks and stereo geometry produce depth and area. Stereo keyframes produce visual place-recognition landmarks, while VO, GPS, IMU, and verified landmarks feed EKF localization.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#334155; stroke-width:2; rx:12; }
      .sensor { fill:#e0f2fe; stroke:#0369a1; }
      .output { fill:#dcfce7; stroke:#15803d; }
      .fusion { fill:#fef3c7; stroke:#a16207; }
      .line { stroke:#334155; stroke-width:2.4; fill:none; marker-end:url(#arrow); }
      .label { font-family:"DejaVu Sans",sans-serif; font-size:20px; fill:#0f172a; text-anchor:middle; dominant-baseline:middle; }
      .small { font-size:17px; }
    </style>
  </defs>
  <rect class="box sensor" x="30" y="75" width="190" height="70"/>
  <text class="label" x="125" y="110">Stereo camera</text>
  <rect class="box sensor" x="30" y="260" width="90" height="58"/>
  <text class="label small" x="75" y="289">GPS</text>
  <rect class="box sensor" x="140" y="260" width="90" height="58"/>
  <text class="label small" x="185" y="289">IMU</text>

  <rect class="box" x="310" y="35" width="235" height="75"/>
  <text class="label" x="427" y="72">Pothole segmentation</text>
  <rect class="box" x="310" y="155" width="235" height="75"/>
  <text class="label" x="427" y="192">Stereo geometry / VO</text>

  <rect class="box output" x="650" y="20" width="200" height="75"/>
  <text class="label" x="750" y="57">Depth + area</text>
  <rect class="box output" x="650" y="120" width="200" height="75"/>
  <text class="label small" x="750" y="157">Landmark observations</text>
  <rect class="box fusion" x="650" y="255" width="265" height="80"/>
  <text class="label small" x="782" y="285">EKF + map-to-odom</text>
  <text class="label small" x="782" y="310">correction</text>
  <rect class="box output" x="995" y="255" width="175" height="80"/>
  <text class="label" x="1082" y="295">Continuous pose</text>

  <path class="line" d="M220 105 L310 72"/>
  <path class="line" d="M220 115 L310 192"/>
  <path class="line" d="M545 72 L650 57"/>
  <path class="line" d="M545 180 L650 75"/>
  <path class="line" d="M545 180 L650 157"/>
  <path class="line" d="M545 205 L650 280"/>
  <path class="line" d="M120 289 L650 289"/>
  <path class="line" d="M230 304 L650 304"/>
  <path class="line" d="M750 195 L782 255"/>
  <path class="line" d="M915 295 L995 295"/>
</svg>
